name: Unity Cloud build 5 diagnostics
on:
  push:
    branches: [automation/unity-api-check]
    paths: ['.github/workflows/unity-cloud-check.yml']
permissions: {}
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read Unity build failure (no build request)
        env:
          UNITY_BUILD_API_KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, re
          from urllib.parse import urljoin, urlparse
          base = "https://build-api.cloud.unity3d.com/api/v1/orgs/4674291933911/projects/5240018a-e89a-427b-a7f1-f87352632e31/buildtargets/operacao-zero-v0-6-android/builds/5"
          key = os.environ["UNITY_BUILD_API_KEY"].strip()
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urlparse(newurl).scheme != "https":
                      raise ValueError("non-HTTPS redirect")
                  return urllib.request.Request(newurl, headers={"Accept":"*/*"})
          opener = urllib.request.build_opener(SafeRedirect())
          def get(url):
              headers = {"Accept":"*/*"}
              if urlparse(url).hostname == "build-api.cloud.unity3d.com":
                  headers["Authorization"] = "Basic "+key
              with opener.open(urllib.request.Request(url, headers=headers),timeout=35) as response:
                  return response.read(20000000).decode("utf-8",errors="replace")
          d=json.loads(get(base))
          print("Status:",d.get("buildStatus"),"revision:",d.get("lastBuiltRevision"))
          target=json.loads(get(base.rsplit("/builds/",1)[0]))
          for label, item in (("target",target),("build",d)):
              for keypath in ("settings.advanced.unity","customConfig.advanced.unity","customConfig.unity","settings.unity"):
                  node=item
                  for part in keypath.split("."):
                      node=node.get(part,{}) if isinstance(node,dict) else {}
                  if node:
                      print(label,keypath,"hook:",node.get("preExportMethod"),"scenes:",(node.get("playerExporter") or {}).get("sceneList"))
          print("Hook check completed")
          for item in d.get("failureDetails") or []:
              print("Failure category:",str(item.get("displayName",""))[:150])
          link=(d.get("links") or {}).get("log") or {}
          url=urljoin(base+"/",link.get("href") or base+"/log")
          try:
              raw=get(url)
              try:
                  obj=json.loads(raw)
                  if isinstance(obj,dict):
                      v=obj.get("url") or obj.get("href") or obj.get("log")
                      if isinstance(v,str) and v.startswith("https://"):
                          raw=get(v)
                      elif isinstance(v,str):
                          raw=v
              except ValueError:
                  pass
              lines=raw.splitlines()
              print("Log lines:",len(lines))
              # Only allow known compiler diagnostics and scene/build errors, never dump private logs.
              for line in lines:
                  if 'ignored in' not in line and 'Reference to method' not in line and re.search(r'error CS\d{4}|(?:NullReference|InvalidOperation|MissingReference|Argument|IOException)Exception:|No scenes|pre.export|BuildFailedException:|\[error\]|FATAL:|Build completed with|build failed|OZBuild|OZRenderSetup',line,re.I):
                      line=re.sub(r'https?://\S+','[url removed]',line)
                      line=re.sub(r'(?i)(token|password|secret|api.?key)\s*[:=]\s*\S+','[redacted]',line)
                      print(line[:650])
              print('EXACT PROJECT ERROR CONTEXT')
              indexes=set()
              for i,line in enumerate(lines):
                  if re.search(r'OZBuild:Prepare|OZRenderSetup:ConfigurePipeline|at OZBuild.Prepare|preExportMethod.*failed',line):
                      indexes.update(range(max(0,i-8),min(len(lines),i+9)))
              for i in sorted(indexes):
                  line=lines[i]
                  if re.search(r'(?i)token|password|secret|api.?key|credential|authorization',line):
                      continue
                  print(str(i+1)+": "+re.sub(r'https?://\S+','[url removed]',line)[:800])
              print('FINAL LOG SUMMARY')
              for line in lines[-120:]:
                  if re.search(r'error|fail|exception|scene|export|OZBuild|OZRenderSetup',line,re.I) and 'ignored in' not in line:
                      print(re.sub(r'https?://\S+','[url removed]',line)[:650])
          except urllib.error.HTTPError as e:
              print("Log retrieval HTTP",e.code)
