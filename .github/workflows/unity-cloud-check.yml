name: Unity Cloud connection check
on:
  push:
    branches: [automation/unity-api-check]
    paths: ['.github/workflows/unity-cloud-check.yml']
  workflow_dispatch:
permissions: {}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Unity Cloud build 4 (read only)
        env:
          UNITY_BUILD_API_KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error
          key = os.environ.get("UNITY_BUILD_API_KEY", "").strip()
          if not key:
              raise SystemExit("UNITY_BUILD_API_KEY missing or unavailable")
          print("UNITY_BUILD_API_KEY available")
          url = "https://build-api.cloud.unity3d.com/api/v1/orgs/4674291933911/projects/5240018a-e89a-427b-a7f1-f87352632e31/buildtargets/operacao-zero-v0-6-android/builds/4"
          req = urllib.request.Request(url, headers={"Authorization": "Basic " + key, "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = json.load(response)
                  print("Unity API HTTP", response.status)
          except urllib.error.HTTPError as e:
              raise SystemExit("Unity API HTTP " + str(e.code))
          except (urllib.error.URLError, ValueError):
              raise SystemExit("Unity API network or response error")
          if not isinstance(data, dict):
              raise SystemExit("Unexpected Unity response")
          print(json.dumps({k:data.get(k) for k in ("build","buildStatus","lastBuiltRevision","requestedRevision","unityVersion","finished","buildReport")}, ensure_ascii=True))
