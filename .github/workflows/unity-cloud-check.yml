name: Unity Cloud build 5 diagnostics
on:
  push:
    branches: [automation/unity-api-check]
    paths: ['.github/workflows/unity-cloud-check.yml']
permissions: {}
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read Unity build failure (no build request)
        env:
          UNITY_BUILD_API_KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, re
          from urllib.parse import urljoin, urlparse
          base = "https://build-api.cloud.unity3d.com/api/v1/orgs/4674291933911/projects/5240018a-e89a-427b-a7f1-f87352632e31/buildtargets/operacao-zero-v0-6-android/builds/5"
          key = os.environ["UNITY_BUILD_API_KEY"].strip()
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urlparse(newurl).scheme != "https":
                      raise ValueError("non-HTTPS redirect")
                  return urllib.request.Request(newurl, headers={"Accept":"*/*"})
          opener = urllib.request.build_opener(SafeRedirect())
          def get(url):
              headers = {"Accept":"*/*"}
              if urlparse(url).hostname == "build-api.cloud.unity3d.com":
                  headers["Authorization"] = "Basic "+key
              with opener.open(urllib.request.Request(url, headers=headers),timeout=35) as response:
                  return response.read(20000000).decode("utf-8",errors="replace")
          d=json.loads(get(base))
          print("Status:",d.get("buildStatus"),"revision:",d.get("lastBuiltRevision"))
          print("Hook:",((d.get("customConfig") or {}).get("unity") or {}).get("preExportMethod") == "OZBuild.CloudPrepare")
          for item in d.get("failureDetails") or []:
              print("Failure category:",str(item.get("displayName",""))[:150])
          link=(d.get("links") or {}).get("log") or {}
          url=urljoin(base+"/",link.get("href") or base+"/log")
          try:
              raw=get(url)
              try:
                  obj=json.loads(raw)
                  if isinstance(obj,dict):
                      v=obj.get("url") or obj.get("href") or obj.get("log")
                      if isinstance(v,str) and v.startswith("https://"):
                          raw=get(v)
                      elif isinstance(v,str):
                          raw=v
              except ValueError:
                  pass
              lines=raw.splitlines()
              print("Log lines:",len(lines))
              # Only allow known compiler diagnostics and scene/build errors, never dump private logs.
              for line in lines:
                  if re.search(r'error CS\d{4}|(?:NullReference|InvalidOperation|MissingReference|Argument|IOException)Exception:|No scenes|pre.export method.*(?:not found|failed)|BuildFailedException:',line,re.I):
                      line=re.sub(r'https?://\S+','[url removed]',line)
                      line=re.sub(r'(?i)(token|password|secret|api.?key)\s*[:=]\s*\S+','[redacted]',line)
                      print(line[:600])
          except urllib.error.HTTPError as e:
              print("Log retrieval HTTP",e.code)
