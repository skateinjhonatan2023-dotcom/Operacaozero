name: Unity Cloud build 6 status
on:
  push:
    branches: [automation/unity-api-check]
    paths: ['.github/workflows/unity-cloud-check.yml']
permissions: {}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query existing build 6 only
        env:
          UNITY_BUILD_API_KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error
          url = "https://build-api.cloud.unity3d.com/api/v1/orgs/4674291933911/projects/5240018a-e89a-427b-a7f1-f87352632e31/buildtargets/operacao-zero-v0-6-android/builds/6"
          req = urllib.request.Request(url,headers={"Authorization":"Basic "+os.environ["UNITY_BUILD_API_KEY"].strip(),"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  data = json.load(response)
                  print("Unity API HTTP",response.status)
          except urllib.error.HTTPError as e:
              raise SystemExit("Unity API HTTP "+str(e.code))
          print(json.dumps({k:data.get(k) for k in ("build","buildStatus","requestedRevision","lastBuiltRevision","unityVersion","finished")},ensure_ascii=True))
