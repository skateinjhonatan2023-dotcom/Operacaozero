name: Android development build
on:
  push:
    branches: [codex/v06-lobby-unity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate imported assets
        run: python3 Tools/preflight.py
      - name: Compile APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.38f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: OZBuild.Android
          versioning: None
      - name: Verify APK
        run: python3 Tools/verify_apk.py Builds/OperationZero-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: operation-zero-android-development
          path: Builds/OperationZero-debug.apk
          if-no-files-found: error
